[project]
name = "mexql"
version = "0.1.0"
description = "Small LLM trained with GRPO for text-to-SQL on BIRD. Stage 1: environment, evaluation and baselines."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.7",
    "numpy>=1.26",
    "tqdm>=4.66",
    "requests>=2.32",
    "transformers>=4.51",
    "huggingface-hub>=0.30",
]

[project.optional-dependencies]
# Local / CPU / Apple Silicon inference for smoke tests (transformers backend).
hf = ["torch>=2.4", "accelerate>=1.0"]
# Fast batched inference on NVIDIA GPUs (Linux only; Colab, workstation).
gpu = ["vllm>=0.10; sys_platform == 'linux'"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "func-timeout>=4.3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mexql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = [
    "bird_data: requires the unpacked BIRD dev set under data/raw",
    "slow: slow tests",
]
